<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro | Loja do Cooperado</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Geist:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "surface-tint": "#7bd0ff", "error": "#ffb4ab", "surface-dim": "#0b1326",
                "tertiary-fixed": "#c9e6ff", "tertiary": "#98d3ff",
                "on-error-container": "#ffdad6", "surface-container": "#171f33",
                "outline-variant": "#3e484f", "on-error": "#690005", "outline": "#87929a",
                "on-primary-container": "#004965", "secondary-container": "#3e495d",
                "on-primary-fixed-variant": "#004c69", "primary-fixed-dim": "#7bd0ff",
                "on-tertiary-container": "#00486a", "tertiary-container": "#43bbff",
                "surface-container-highest": "#2d3449", "inverse-surface": "#dae2fd",
                "inverse-primary": "#00668a", "on-primary-fixed": "#001e2c",
                "error-container": "#93000a", "on-secondary": "#263143",
                "inverse-on-surface": "#283044", "surface-container-lowest": "#060e20",
                "secondary-fixed": "#d8e3fb", "surface-container-low": "#131b2e",
                "on-tertiary-fixed": "#001e2f", "surface-container-high": "#222a3d",
                "on-surface": "#dae2fd", "on-surface-variant": "#bdc8d1",
                "on-secondary-fixed-variant": "#3c475a", "surface-variant": "#2d3449",
                "primary-fixed": "#c4e7ff", "on-background": "#dae2fd", "primary": "#8ed5ff",
                "primary-container": "#38bdf8", "on-primary": "#00354a",
                "on-tertiary-fixed-variant": "#004c6e", "background": "#0b1326",
                "surface": "#0b1326", "surface-bright": "#31394d",
                "on-secondary-fixed": "#111c2d", "on-tertiary": "#00344d",
                "secondary": "#bcc7de", "secondary-fixed-dim": "#bcc7de",
                "on-secondary-container": "#aeb9d0", "tertiary-fixed-dim": "#89ceff"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: { xs: "0.5rem", md: "1.5rem", xl: "3rem", base: "4px", lg: "2rem", sm: "1rem" },
            fontFamily: { "body-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-sm": ["Geist"], "label-md": ["Geist"], "body-md": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"] },
            fontSize: {
                "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]

        }
    }
}

<style>
    body { background-color: #0b1326; color: #dae2fd; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(23, 31, 51, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
    .btn-primary { background: linear-gradient(135deg, #38bdf8 0%, #00668a 100%); transition: all 0.3s ease; }
    .btn-primary:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); transform: scale(1.02); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="selection:bg-primary-container selection:text-on-primary">
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10">
<div class="flex justify-between items-center h-20 px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto">
<a href="index.html" class="font-headline-md text-headline-md font-bold text-primary tracking-tighter">Loja do Cooperado</a>
<div class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="index.html">Início</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="produtos.html">Produtos</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="produtos.html?filter=destaques">Ofertas</a>
</div>
<div class="flex items-center gap-4">
<a href="carrinho.html" class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors">shopping_cart</a>
<a href="admin.html" class="text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md">Admin</a>
</div>
</div>
</nav>

<main class="min-h-screen flex items-center justify-center pt-20 px-4">
<div class="glass-card rounded-2xl p-xl w-full max-w-md">
<div class="text-center mb-lg">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-primary text-3xl">person_add</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Criar Conta</h1>
<p class="text-on-surface-variant font-body-md text-body-md mt-2">Cadastre-se para aproveitar ofertas exclusivas</p>
</div>
<form id="form-cadastro" class="space-y-md" onsubmit="return false;">
<div>
<label class="text-on-surface-variant text-sm block mb-1 font-label-md text-label-md">Nome</label>
<input id="cad-nome" type="text" class="w-full bg-surface-container border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 text-on-surface" placeholder="Seu nome completo" required/>
</div>
<div>
<label class="text-on-surface-variant text-sm block mb-1 font-label-md text-label-md">E-mail</label>
<input id="cad-email" type="email" class="w-full bg-surface-container border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 text-on-surface" placeholder="seu@email.com" required/>
</div>
<div>
<label class="text-on-surface-variant text-sm block mb-1 font-label-md text-label-md">Senha</label>
<input id="cad-senha" type="password" class="w-full bg-surface-container border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 text-on-surface" placeholder="Mínimo 6 caracteres" required minlength="6"/>
</div>
<div>
<label class="text-on-surface-variant text-sm block mb-1 font-label-md text-label-md">Confirmar Senha</label>
<input id="cad-confirmar" type="password" class="w-full bg-surface-container border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 text-on-surface" placeholder="Repita a senha" required/>
</div>
<div id="cad-erro" class="text-error text-sm hidden"></div>
<button type="submit" class="btn-primary w-full py-3 rounded-xl font-label-md text-label-md text-on-primary font-bold flex items-center justify-center gap-2" onclick="cadastrar()">
<span>Cadastrar</span>
<span class="material-symbols-outlined text-lg">person_add</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="text-on-surface-variant font-body-md text-body-md">
Já tem conta?
<a href="login.html" class="text-primary hover:underline font-semibold">Entrar</a>
</p>
</div>
</div>
</div>

<script src="JS/api.js"></script>
<script src="JS/auth.js"></script>
</body>
</html>
